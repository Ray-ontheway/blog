# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: Deploy VitePress site to Pages

on:
  # 在针对 `main` 分支的推送上运行。如果你
  # 使用 `master` 分支作为默认分支，请将其更改为 `master`
  push:
    branches: [main]
  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: docs-site

jobs:
  # ========================
  #   共享：构建 VitePress
  # ========================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - uses: pnpm/action-setup@v4 # 如果使用 pnpm，请取消此区域注释
        # with:
        #   version: 10
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm # 或 pnpm / yarn
      - name: Install dependencies
        run: pnpm install # 或 pnpm install / yarn install / bun install
      - name: Build with VitePress
        run: pnpm docs:build # 或 pnpm docs:build / yarn docs:build / bun run docs:build

      # 上传构建产物供两个部署任务使用
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          name: vitepress-site
          path: docs/.vitepress/dist
          retention-days: 1

  # ========================
  #   分支 A：部署到 GitHub Pages
  # ========================
  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: build
    # 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Github Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================
  #   分支 B：部署到私有服务器
  # ========================
  deploy-private-server:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vitepress-site
          path: docs/.vitepress/dist

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "${{secrets.REGISTRY_PASSWORD}}" | \
              podman login localhost:5000 \
              -u ${{ secrets.REGISTRY_USER }} \
              --password-stdin

            podman pull localhost:5000/${{ env.IMAGE_NAME }}:latest

            podman stop docs-site 2>/dev/null || true
            podman rm docs-site 2>/dev/null || true
            podman run -d \
              --name docs-site \
              --restart always \
              -p 127.0.0.1:3001:80 \
              localhost:5000/${{ env.IMAGE_NAME }}:latest

            podman image prune -f
            echo "✅ Private server deployed"
